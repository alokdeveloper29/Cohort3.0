<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <title>To Do List</title>
</head>

<body>
    <!doctype html>
    <html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo List</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div class="container">
            <h1>To Do List with HTML, CSS & JS</h1>

            <div class="tablet">
                <div class="top-bar">
                    <span>Hello, </span>
                    <span id="time">03:24 PM</span>
                </div>

                <h2>To Do List 📝</h2>

                <div class="task-input">
                    <input id="input" type="text" placeholder="Add new task" />
                    <button id="addBtn">Add</button>
                </div>

                <div class="allTask"></div>

                <div class="deleteBox">
                    <p class="cancelBtn">cancel</p>
                    <p class="deleteBtn">delete</p>
                </div>

                <div class="editBox">
                    <input id="editInput" type="text" />
                    <button class="done">Done</button>
                </div>

                
            </div>
        </div>
    </body>

    </html>
    <script src="script.js"></script>
</body>

</html>
