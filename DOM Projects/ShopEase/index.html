<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <!-- NAVBAR -->
      <nav>
        <div class="logo">Shop<span>Ease</span></div>
        <input type="text" placeholder="🔍  Search products..." />
        <div class="nav-right">
          <span>Home</span>
          <span>Products</span>
          <button class="product-btn">Add Product</button>
          
        </div>
      </nav>

      <!-- HERO -->
      <div class="hero">
        <h1>Our <span>Products</span></h1>
        <p>Top quality items — update or remove anytime</p>
      </div>

      <!-- PRODUCT GRID -->
      <div class="product-grid"></div>

      <div class="wrapper">
        <div class="form-card">
          <div class="form-header">
            <h1 class="heading">Add New <span>Product</span></h1>
            <p class="headingP">Fill in the details below to create a new product card</p>
          </div>

          <form id="form">
            <!-- Image URL -->
            <div class="input-group">
              <label for="imageUrl">🖼️ Image URL</label>
              <input
                required
                type="url"
                id="imageUrl"
                placeholder="https://example.com/image.jpg"
              />
            </div>
            <!-- Badge -->
            <div class="input-group">
              <label for="badge">🏷️ Badge</label>
              <input
                required
                type="text"
                id="badge"
                placeholder="e.g. New, Hot, Sale, Premium"
              />
            </div>
            <!-- Product Type -->
            <div class="input-group">
              <label for="productType">📦 Product Type</label>
              <input
                required
                type="text"
                id="productType"
                placeholder="e.g. Shoe, Mobile, Pen, Laptop"
              />
            </div>
            <!-- Product Name -->
            <div class="input-group">
              <label for="productName">🛍️ Product Name</label>
              <input
                required
                type="text"
                id="productName"
                placeholder="e.g. Nike Air Max 270 Running Shoe"
              />
            </div>
            <!-- Product Price -->
            <div class="input-group">
              <label for="productPrice">💰 Product Price</label>
              <div class="price-input-wrapper">
                <span class="currency">₹</span>
                <input
                  required
                  type="number"
                  id="productPrice"
                  placeholder="e.g. 7499"
                />
              </div>
            </div>
            <!-- cutoffProduct Price -->
            <div class="input-group">
              <label for="productPrice">💰cutoff Price</label>
              <div class="price-input-wrapper">
                <span class="currency">₹</span>
                <input
                  required
                  type="number"
                  id="cutoffPrice"
                  placeholder="e.g. 9499"
                />
              </div>
            </div>
            <!-- Create Button -->
            <div class="cancel-createBtn">
              <button type="button" class="cancel-btn">Cancel Product</button>
              <button type="submit" class="create-btn">+ Create Product</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
