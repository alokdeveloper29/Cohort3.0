<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Cards Generator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>User Card Generator</h1>

        <div class="form-container">
            <form id="form">
                <input required id="username" type="text" placeholder="Enter Username" />
                <input required id="email" type="email" placeholder="Enter Email" />
                <input required id="imageUrl" type="url" placeholder="Enter Image URL" />
                <button type="submit" id="submitBtn">Create Card</button>
            </form>
        </div>

        <div id="cardContainer" class="card-container">

        </div>

        <div class="deleteBox">
            <p class="cancelBtn">cancel</p>
            <p class="deleteBtn">delete</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
